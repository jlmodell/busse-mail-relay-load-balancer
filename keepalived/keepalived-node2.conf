# OPTIONAL - 2-node setup. Runs on the Docker HOST (not in the container): /etc/keepalived/keepalived.conf on node 2 (BACKUP)
global_defs {
    enable_script_security
    script_user root
}

vrrp_script chk_postfix {
    script "/usr/bin/docker exec busse-mail-relay postfix status"
    interval 5
    fall 2
    rise 2
}

vrrp_instance MAILRELAY {
    state BACKUP
    interface eth0                 # verify NIC name in the LXC/VM
    virtual_router_id 51           # must be unique on this VLAN
    priority 100
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass <8_CHAR_SECRET>
    }
    virtual_ipaddress {
        <VIP>/24                   # the IP the ERP sends to
    }
    track_script {
        chk_postfix
    }
}
