# OPTIONAL - only for a 2-node setup. /etc/keepalived/keepalived.conf on node 2 (BACKUP)
global_defs {
    enable_script_security
    script_user root
}

vrrp_script chk_postfix {
    script "/usr/bin/systemctl is-active --quiet postfix"
    interval 5
    fall 2
    rise 2
}

vrrp_instance MAILRELAY {
    state BACKUP
    interface eth0                 # verify NIC name in the LXC/VM
    virtual_router_id 51           # must be unique on this VLAN
    priority 100
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass <8_CHAR_SECRET>
    }
    virtual_ipaddress {
        <VIP>/24                   # the IP the ERP sends to
    }
    track_script {
        chk_postfix
    }
}
